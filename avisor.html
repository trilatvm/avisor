<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Avisor</title>
<div hidden>GNU GPL3, Generado con IA</div hidden>
<style>
/* Reiniciar márgenes y definir color único rojo oscuro */
*{box-sizing:border-box;margin:0;padding:0;color:#8b0000}

/* Configurar contenedor principal sin barras de desplazamiento */
html,body{width:100%;height:100%;overflow:hidden;background:#000;font-family:ui-monospace,'Cascadia Code','Fira Code','Consolas','Liberation Mono','Courier New',monospace;text-transform:lowercase;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;user-select:none;touch-action:none}

/* Definir animación de destello blanco rápido */
@keyframes flash{0%,100%{background:#fff}50%{background:#000}}
body.flash{animation:flash .1s infinite}

/* Estructurar distribución vertical centrada */
.wrap{width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:3.5vh}
.line{width:100vw;white-space:nowrap;line-height:1}

/* Ocultar leyenda del flujo para recentrar contenido */
#fmt{cursor:pointer}
#fmt.hidden{display:none}

/* Mostrar punto discreto para restaurar leyenda oculta */
#fmtRestore{display:none;position:fixed;top:2.5vh;left:2.5vw;width:12px;height:12px;border-radius:50%;background:#8b0000;cursor:pointer;z-index:20}
#fmtRestore.visible{display:block}

#clk,.wheel{font-weight:700}

/* Configurar celdas interactivas de la rueda */
.wheel{display:flex;justify-content:center;align-items:center;margin-top:1.5vh}
.cell{display:inline-block;cursor:ns-resize;padding:0;transition:transform .1s}
.cell.drag{transform:scale(1.12)}
.sep{display:inline-block}

/* Alinear barra horizontal de controles */
.controls{display:flex;justify-content:center;align-items:center;gap:clamp(14px,3.8vw,48px);margin-top:2vh}
button{position:relative;background:none;border:none;cursor:pointer;width:clamp(34px,5.2vw,64px);height:clamp(34px,5.2vw,64px);transition:transform .15s}
button:active{transform:scale(.9)}
button svg{width:100%;height:100%;display:block;fill:#8b0000}

/* Mostrar punto indicador debajo del modo seleccionado */
button.active::after{content:'';position:absolute;bottom:-10px;left:50%;transform:translateX(-50%);width:6px;height:6px;border-radius:50%;background:#8b0000}

/* Ocultar controles en modo reloj puro */
body.clock-mode{cursor:pointer}
body.clock-mode .wheel,
body.clock-mode .controls{display:none}
</style>
</head>

<body>
<!-- Punto discreto para restaurar leyenda oculta -->
<div id="fmtRestore" aria-label="mostrar leyenda"></div>

<div class="wrap">
  <div class="line" id="fmt">yyyy mm dd hh mm ss</div>
  <div class="line" id="clk">0000 00 00 00 00 00</div>
  <div class="line wheel" id="wheel"></div>

  <div class="controls" id="controls">
    <!-- Activar modo reloj puro -->
    <button id="clkBtn" aria-label="modo reloj">
      <svg viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm0 18a8 8 0 1 1 0-16 8 8 0 0 1 0 16zm.5-13H11v6l5.2 3.2.8-1.3-4.5-2.7V7z"/>
      </svg>
    </button>

    <!-- Iniciar o pausar ejecución -->
    <button id="btn" aria-label="play/pause">
      <svg id="iPlay" viewBox="0 0 24 24">
        <path d="M7.5 4.8C6.6 4.2 5.5 4.9 5.5 5.9v12.2c0 1 1.1 1.7 2 1.1l9.8-6.1c.8-.5.8-1.7 0-2.2L7.5 4.8z"/>
      </svg>
      <svg id="iPause" viewBox="0 0 24 24" style="display:none">
        <rect x="6" y="4.5" width="4" height="15" rx="2"/>
        <rect x="14" y="4.5" width="4" height="15" rx="2"/>
      </svg>
    </button>

    <!-- Seleccionar modo flash cíclico -->
    <button id="mFlash" class="mode-btn active" data-mode="flash" aria-label="modo flash">
      <svg viewBox="0 0 24 24">
        <path d="M13 2L4.5 13.5h6.5L10 22l8.5-11.5H12L13 2z"/>
      </svg>
    </button>

    <!-- Seleccionar modo cronómetro ascendente -->
    <button id="mCrono" class="mode-btn" data-mode="crono" aria-label="cronometro">
      <svg viewBox="0 0 24 24">
        <path d="M12 5.2c-.5 0-1 .3-1.3.7l-6.1 10.2c-.6 1 .1 2.2 1.3 2.2h12.2c1.2 0 1.9-1.2 1.3-2.2L13.3 5.9c-.3-.4-.8-.7-1.3-.7z"/>
      </svg>
    </button>

    <!-- Seleccionar modo temporizador descendente -->
    <button id="mTimer" class="mode-btn" data-mode="timer" aria-label="temporizador">
      <svg viewBox="0 0 24 24">
        <path d="M12 18.8c.5 0 1-.3 1.3-.7l6.1-10.2c.6-1-.1-2.2-1.3-2.2H5.9c-1.2 0-1.9 1.2-1.3 2.2l6.1 10.2c.3.4.8.7 1.3.7z"/>
      </svg>
    </button>

    <!-- Seleccionar modo cuenta regresiva por fecha calendario -->
    <button id="mDate" class="mode-btn" data-mode="date" aria-label="modo fecha">
      <svg viewBox="0 0 24 24">
        <path d="M19 4h-1V2h-2v2H8V2H6v2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 16H5V10h14v10zm0-12H5V6h14v2z"/>
      </svg>
    </button>

    <!-- Alternar pantalla completa -->
    <button id="fsBtn" aria-label="pantalla completa">
      <svg id="iFsIn" viewBox="0 0 24 24">
        <path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>
      </svg>
      <svg id="iFsOut" viewBox="0 0 24 24" style="display:none">
        <path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>
      </svg>
    </button>
  </div>
</div>

<script>
/* Referenciar elementos del DOM y definir unidades temporales */
const $=id=>document.getElementById(id),
fmt=$('fmt'),fmtRestore=$('fmtRestore'),clk=$('clk'),wheel=$('wheel'),clkBtn=$('clkBtn'),btn=$('btn'),iPlay=$('iPlay'),iPause=$('iPause'),
fsBtn=$('fsBtn'),iFsIn=$('iFsIn'),iFsOut=$('iFsOut'),
modeBtns=[...document.querySelectorAll('.mode-btn')],
units=[
  {d:4,max:9999,min:0,v:0,m:31536000},
  {d:2,max:99,min:0,v:0,m:2592000},
  {d:2,max:99,min:0,v:0,m:86400},
  {d:2,max:99,min:0,v:0,m:3600},
  {d:2,max:99,min:0,v:0,m:60},
  {d:2,max:99,min:0,v:15,m:1}
],
pad=(n,d)=>String(n).padStart(d,'0'),
cv=document.createElement('canvas').getContext('2d');

/* Declarar variables de estado global sin deriva temporal */
let timer=null,flashT=null,run=0,mode='flash',active=null,y0=0,y1=0,acc=0,raf=0,
lastStepTs=0,accumMs=0,cronoTarget=0,cronoStarted=0,targetDate=null;

/* Generar celdas HTML de la rueda */
wheel.innerHTML=units.map((u,i)=>
  `<span class="cell" data-i="${i}">${pad(u.v,u.d)}</span>${i<5?'<span class="sep">&nbsp;</span>':''}`
).join('');
const cells=[...document.querySelectorAll('.cell')];

/* Renderizar valores actuales en la rueda */
const renderWheel=()=>units.forEach((u,i)=>cells[i].textContent=pad(u.v,u.d));

/* Convertir segundos totales a unidades de la rueda */
const setWheelFromSec=sec=>{
  let rem=Math.max(0,Math.floor(sec));
  units.forEach((u,i)=>{
    const val=Math.min(u.max,Math.floor(rem/u.m));
    u.v=val;
    rem-=val*u.m;
    cells[i].textContent=pad(val,u.d);
  });
};

/* Calcular diferencia exacta de calendario entre dos fechas */
const setWheelFromDateDiff=(now,target)=>{
  if(target<=now){setWheelFromSec(0);return}
  let y=target.getFullYear()-now.getFullYear();
  let mo=target.getMonth()-now.getMonth();
  let d=target.getDate()-now.getDate();
  let h=target.getHours()-now.getHours();
  let mi=target.getMinutes()-now.getMinutes();
  let s=target.getSeconds()-now.getSeconds();

  if(s<0){s+=60;mi--}
  if(mi<0){mi+=60;h--}
  if(h<0){h+=24;d--}
  if(d<0){
    const prevMonthDays=new Date(target.getFullYear(),target.getMonth(),0).getDate();
    d+=prevMonthDays;
    mo--;
  }
  if(mo<0){mo+=12;y--}

  const vals=[Math.max(0,y),mo,d,h,mi,s];
  units.forEach((u,i)=>u.v=Math.min(u.max,vals[i]));
  renderWheel();
};

/* Ajustar límites de validación según modo activo */
const applyLimits=()=>{
  const isDate=mode==='date';
  units.max=isDate?12:99;units.min=isDate?1:0;
  units.max=isDate?31:99;units.min=isDate?1:0;
  units.max=isDate?23:99;
  units.max=isDate?59:99;
  units.max=isDate?59:99;
  units.forEach(u=>{u.v=Math.min(u.max,Math.max(u.min,u.v))});
  renderWheel();
};

/* Cargar fecha de próximo año nuevo en la rueda */
const loadNextNewYear=()=>{
  const nextYear=new Date().getFullYear()+1;
  const vals=[nextYear,1,1,0,0,0];
  units.forEach((u,i)=>u.v=vals[i]);
  renderWheel();
};

/* Escalar fuente de borde a borde según ancho de ventana */
const fit=(el,ref)=>{
  const st=getComputedStyle(el);
  cv.font=`${st.fontWeight} 100px ${st.fontFamily}`;
  const w=cv.measureText(ref).width;
  if(w>0)el.style.fontSize=(innerWidth*.99/w)*100+'px';
};
const resize=()=>[fmt,clk,wheel].forEach((e,i)=>fit(e,i?'0000 00 00 00 00 00':'yyyy mm dd hh mm ss'));

/* Actualizar reloj del sistema */
const tick=()=>{
  const n=new Date();
  clk.textContent=`${pad(n.getFullYear(),4)} ${pad(n.getMonth()+1,2)} ${pad(n.getDate(),2)} ${pad(n.getHours(),2)} ${pad(n.getMinutes(),2)} ${pad(n.getSeconds(),2)}`;
};
tick();setInterval(tick,250);

/* Procesar movimiento vertical continuo de la rueda */
const loop=()=>{
  if(!active)return;
  const dy=y0-y1,dist=Math.abs(dy);
  if(dist>6){
    acc+=Math.pow((dist-6)/18,1.85)*.35*(dy>0?1:-1);
    if(Math.abs(acc)>=1){
      const step=Math.trunc(acc),u=units[+active.dataset.i];
      acc-=step;
      u.v=Math.min(u.max,Math.max(u.min,u.v+step));
      active.textContent=pad(u.v,u.d);
      if(mode==='crono'){cronoStarted=0;accumMs=0}
      if(mode==='date'){targetDate=null}
    }
  }
  raf=requestAnimationFrame(loop);
};

/* Vincular eventos de puntero a cada celda */
cells.forEach(c=>{
  c.onpointerdown=e=>{
    if(run)return;
    e.preventDefault();active=c;y0=y1=e.clientY;acc=0;
    c.classList.add('drag');c.setPointerCapture(e.pointerId);
    raf=requestAnimationFrame(loop);
  };
  c.onpointermove=e=>{if(active===c)y1=e.clientY};
  c.onpointerup=c.onpointercancel=()=>{
    if(active===c){c.classList.remove('drag');active=null;cancelAnimationFrame(raf)}
  };
});

/* Controlar animación de destello blanco */
const stopFlash=()=>{document.body.classList.remove('flash');clearTimeout(flashT)};
const triggerFlash=()=>{
  stopFlash();
  document.body.classList.add('flash');
  flashT=setTimeout(()=>document.body.classList.remove('flash'),1000);
};
const totalSec=()=>units.reduce((a,u)=>a+u.v*u.m,0);

/* Alternar estado de ejecución y apariencia de botones */
const setRunning=state=>{
  run=state?1:0;
  iPlay.style.display=run?'none':'block';
  iPause.style.display=run?'block':'none';
  if(!run){clearInterval(timer);timer=null;stopFlash()}
};

/* Gestionar cambio entre modos operativos */
modeBtns.forEach(b=>{
  b.onclick=()=>{
    setRunning(0);
    accumMs=0;
    cronoStarted=0;
    targetDate=null;
    mode=b.dataset.mode;
    modeBtns.forEach(x=>x.classList.toggle('active',x===b));
    applyLimits();
    if(mode==='date'){
      loadNextNewYear();
    }else if(totalSec()<=0){
      setWheelFromSec(15);
    }
  };
});

/* Ejecutar lógica principal mediante reloj de alta precisión */
btn.onclick=()=>{
  if(run){setRunning(0);return}

  lastStepTs=performance.now();

  if(mode==='flash'){
    if(totalSec()<=0)setWheelFromSec(15);
    setRunning(1);
    timer=setInterval(()=>{
      const now=performance.now();
      accumMs+=now-lastStepTs;
      lastStepTs=now;
      const targetMs=Math.max(1,totalSec())*1000;
      if(accumMs>=targetMs){
        accumMs%=targetMs;
        triggerFlash();
      }
    },100);
  }else if(mode==='crono'){
    if(!cronoStarted){
      cronoTarget=totalSec();
      if(cronoTarget<=0)return;
      accumMs=0;
      cronoStarted=1;
      setWheelFromSec(0);
    }
    setRunning(1);
    timer=setInterval(()=>{
      const now=performance.now();
      accumMs+=now-lastStepTs;
      lastStepTs=now;
      const sec=Math.floor(accumMs/1000);
      setWheelFromSec(Math.min(cronoTarget,sec));
      if(sec>=cronoTarget){
        setRunning(0);
        cronoStarted=0;
        accumMs=0;
        triggerFlash();
      }
    },100);
  }else if(mode==='timer'){
    const initialRem=totalSec();
    if(initialRem<=0)return;
    accumMs=0;
    setRunning(1);
    timer=setInterval(()=>{
      const now=performance.now();
      accumMs+=now-lastStepTs;
      lastStepTs=now;
      const rem=initialRem-Math.floor(accumMs/1000);
      setWheelFromSec(rem);
      if(rem<=0){
        setRunning(0);
        accumMs=0;
        triggerFlash();
      }
    },100);
  }else if(mode==='date'){
    if(!targetDate){
      targetDate=new Date(units.v,units.v-1,units.v,units.v,units.v,units.v);
    }
    const updateDateCountdown=()=>{
      const now=new Date();
      if(targetDate.getTime()-now.getTime()<=0){
        setWheelFromSec(0);
        setRunning(0);
        targetDate=null;
        triggerFlash();
        return false;
      }
      setWheelFromDateDiff(now,targetDate);
      return true;
    };
    if(!updateDateCountdown())return;
    setRunning(1);
    timer=setInterval(updateDateCountdown,200);
  }
};

/* Ocultar leyenda y recentrar contenido verticalmente */
fmt.onclick=e=>{
  e.stopPropagation();
  fmt.classList.add('hidden');
  fmtRestore.classList.add('visible');
};

/* Restaurar leyenda oculta sin salir del modo actual */
fmtRestore.onclick=e=>{
  e.stopPropagation();
  fmt.classList.remove('hidden');
  fmtRestore.classList.remove('visible');
  resize();
};

/* Activar vista exclusiva de reloj */
clkBtn.onclick=e=>{
  e.stopPropagation();
  document.body.classList.add('clock-mode');
};

/* Restaurar vista completa al pulsar pantalla fuera de la leyenda */
document.body.onclick=()=>{
  if(document.body.classList.contains('clock-mode')){
    document.body.classList.remove('clock-mode');
    resize();
  }
};

/* Alternar modo pantalla completa del navegador */
fsBtn.onclick=()=>{
  if(!document.fullscreenElement){
    document.documentElement.requestFullscreen().catch(()=>{});
  }else{
    document.exitFullscreen().catch(()=>{});
  }
};

/* Sincronizar ícono y escalado al cambiar pantalla completa */
document.onfullscreenchange=()=>{
  const isFs=!!document.fullscreenElement;
  iFsIn.style.display=isFs?'none':'block';
  iFsOut.style.display=isFs?'block':'none';
  resize();
};

/* Inicializar dimensiones */
onresize=onload=resize;resize();
</script>
</body>
</html>
